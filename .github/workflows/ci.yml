name: Pytest API Automation CI/CD

# Automatically trigger workflow on:
# 1. Push to main branch - runs immediately after push
# 2. Pull request to main branch - runs before merge
# 3. Manual trigger - run from GitHub Actions tab anytime
# Version: 2.0 (Updated with latest GitHub Actions)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    description: 'Manually trigger the workflow'

# Define jobs
jobs:
  test:
    # Run on latest Ubuntu runner
    runs-on: ubuntu-latest

    # Define Python version
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    # Define steps to execute
    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install dependencies from requirements.txt
      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Verify pytest-html is installed (already in requirements.txt)
      - name: Verify pytest-html plugin is installed
        run: pip show pytest-html

      # Step 5: Run pytest tests and generate HTML report
      - name: Run pytest tests and generate HTML report
        run: pytest -v --html=report.html --self-contained-html
        continue-on-error: true

      # Step 6: Upload generated HTML report as GitHub Actions artifact
      - name: Upload pytest HTML report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: report.html
          retention-days: 30

      # Step 7: Display test summary
      - name: Display test report location
        if: always()
        run: |
          echo "Test report generated: report.html"
          echo "Download artifact: pytest-report-python-${{ matrix.python-version }}"
